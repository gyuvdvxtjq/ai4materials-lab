[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4materials-lab"
version = "0.2.0"
description = "Reproducible AI for materials demos: band-gap prediction, crystal GNN benchmarking, and candidate screening."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gyuvdvxtjq" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pymatgen>=2024.1",
    "matminer>=0.9",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
gnn = ["torch>=2.0", "torch_geometric>=2.5"]
benchmark = ["matbench>=0.6"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["p1_opt", "p2_gnn_v2", "p3_screen_v2", "benchmark"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
